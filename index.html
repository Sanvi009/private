<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Social media preview (Open Graph for Facebook, LinkedIn, etc.) -->
    <meta property="og:title" content="Hello - Simple Page" />
    <!-- No description used (as requested) -->
    <meta property="og:image" content="Picsart_26-08-22_01-04-05-210.jpg" />
    <meta property="og:type" content="website" />
    <!-- Twitter card preview (optional but consistent) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Hello - Simple Page">
    <meta name="twitter:image" content="Picsart_26-08-22_01-04-05-210.jpg">
    <!-- No description meta tags (as per instruction) -->
    
    <title>Hello</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(145deg, #f8f9fc 0%, #eef1f7 100%);
            color: #1e293b;
            text-align: center;
            padding: 1rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2.5rem 3rem;
            box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.2), 
                        0 8px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }
        h1 {
            font-size: clamp(4rem, 12vw, 7rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            background: linear-gradient(135deg, #0f172a, #3b4a6b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.25rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.03);
        }
        .greeting-sub {
            font-size: 1.2rem;
            color: #55657e;
            font-weight: 450;
            letter-spacing: 0.2px;
            border-bottom: 2px dashed #b9c4d4;
            padding-bottom: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .preview-note {
            background: #ffffffc8;
            border-radius: 100px;
            padding: 0.45rem 1.2rem;
            font-size: 0.85rem;
            color: #475569;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #e2e8f0;
            font-weight: 500;
        }
        .preview-note span {
            background: #dbeafe;
            border-radius: 30px;
            padding: 2px 8px;
            font-weight: 600;
            color: #1e4a7a;
        }
        /* stylish small icon to hint share */
        .share-hint {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            opacity: 0.7;
        }
        .share-hint svg {
            width: 24px;
            height: 24px;
            fill: #5c6c82;
        }
        /* responsive */
        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.5rem;
                border-radius: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hello</h1>
        <div class="greeting-sub">welcome to this page</div>
        
        <!-- subtle note about social preview (only title & image, no description) -->
        <div class="preview-note">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#3a6ab0">
                <circle cx="18" cy="5" r="3"></circle>
                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            <span>og:title</span> + <span>og:image</span> (no description)
        </div>
        
        <!-- decorative small share icons, just for visual -->
        <div class="share-hint">
            <!-- facebook icon -->
            <svg viewBox="0 0 24 24" width="20" height="20">
                <path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c5.05-.5 9-4.76 9-9.95z"/>
            </svg>
            <!-- twitter icon -->
            <svg viewBox="0 0 24 24" width="20" height="20">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
            <!-- link icon -->
            <svg viewBox="0 0 24 24" width="20" height="20">
                <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/>
            </svg>
        </div>
    </div>

    <!-- small meta note: image path is referenced in og:image and twitter:image, 
         exactly as requested: Picsart_26-08-22_01-04-05-210.jpg from root -->
    
    <!-- set simple dynamic behavior (nothing complex, just a tiny hover effect via JS) -->
    <script>
        (function() {
            // just add a slight interactive tilt or subtle animation, purely extra
            const card = document.querySelector('.card');
            if (card) {
                // add gentle movement on mousemove (optional, but simple)
                document.addEventListener('mousemove', (e) => {
                    const x = (e.clientX / window.innerWidth - 0.5) * 6;
                    const y = (e.clientY / window.innerHeight - 0.5) * 6;
                    card.style.transform = `perspective(800px) rotateY(${x}deg) rotateX(${-y}deg) scale(1.01)`;
                });
                // reset on mouse leave
                document.addEventListener('mouseleave', () => {
                    card.style.transform = 'perspective(800px) rotateY(0) rotateX(0) scale(1)';
                });
            }
            // confirm the title and image (for debugging - no visible change)
            console.log('og:title = "Hello - Simple Page"');
            console.log('og:image = "Picsart_26-08-22_01-04-05-210.jpg" (root)');
        })();
    </script>
</body>
              </html>
