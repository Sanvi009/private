<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-image: url('/background.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
        }

        /* remove all potential content artifacts */
        body::before,
        body::after,
        html::before,
        html::after {
            display: none;
            content: none;
        }

        /* WhatsApp-style circular profile picture */
        .profile-container {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            background-color: rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        .profile-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* WhatsApp-style name below the profile picture */
        .profile-name {
            position: fixed;
            top: 160px; /* 30px top + 120px height + 10px gap */
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 20px;
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
            z-index: 1000;
            letter-spacing: 0.3px;
            line-height: 1.4;
        }

        /* responsive adjustments for very small screens */
        @media (max-width: 400px) {
            .profile-container {
                width: 90px;
                height: 90px;
                top: 20px;
                border-width: 2.5px;
            }
            .profile-name {
                top: 120px; /* 20px top + 90px height + 10px gap */
                font-size: 17px;
            }
        }

        @media (max-height: 500px) {
            .profile-container {
                width: 80px;
                height: 80px;
                top: 10px;
            }
            .profile-name {
                top: 100px; /* 10px top + 80px height + 10px gap */
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Circular profile picture - WhatsApp style -->
    <div class="profile-container">
        <img src="/assets/dp.png" alt="">
    </div>
    
    <!-- Name below the profile picture - WhatsApp style -->
    <div class="profile-name">খাদিজা আক্তার</div>
</body>
</html>
