<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-image: url('/background.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
        }

        /* remove all potential content artifacts */
        body::before,
        body::after,
        html::before,
        html::after {
            display: none;
            content: none;
        }

        /* WhatsApp-style circular profile picture */
        .profile-container {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            background-color: rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        .profile-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* WhatsApp-style name below the profile picture */
        .profile-name {
            position: fixed;
            top: 160px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 20px;
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
            z-index: 1000;
            letter-spacing: 0.3px;
            line-height: 1.4;
        }

        /* WhatsApp-style partially hidden phone number */
        .profile-phone {
            position: fixed;
            top: 195px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.9);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            font-weight: 400;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
            z-index: 1000;
            letter-spacing: 0.5px;
            line-height: 1.4;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .phone-visible {
            display: inline-block;
        }

        .phone-hidden {
            display: inline-block;
            filter: blur(4px);
            opacity: 0.5;
            user-select: none;
            pointer-events: none;
        }

        .lock-icon {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            margin-left: 2px;
        }

        /* WhatsApp-style contact button */
        .contact-button {
            position: fixed;
            top: 240px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #00a884;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 15px;
            font-weight: 600;
            padding: 12px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 168, 132, 0.4);
            transition: all 0.3s ease;
            z-index: 1000;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .contact-button:hover {
            background-color: #008f72;
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 168, 132, 0.5);
        }

        .contact-button:active {
            transform: translateX(-50%) scale(0.95);
            box-shadow: 0 2px 10px rgba(0, 168, 132, 0.4);
        }

        .button-icon {
            font-size: 18px;
            line-height: 1;
        }

        /* Instruction text below the contact button */
        .instruction-text {
            position: fixed;
            top: 295px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
            font-weight: 400;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
            line-height: 1.6;
            text-align: center;
            max-width: 350px;
            width: 90%;
            z-index: 1000;
            background-color: rgba(0, 0, 0, 0.35);
            padding: 10px 15px;
            border-radius: 12px;
            backdrop-filter: blur(3px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.2px;
            word-spacing: 0.5px;
        }

        /* responsive adjustments */
        @media (max-width: 400px) {
            .profile-container {
                width: 90px;
                height: 90px;
                top: 20px;
                border-width: 2.5px;
            }
            .profile-name {
                top: 120px;
                font-size: 17px;
            }
            .profile-phone {
                top: 150px;
                font-size: 12px;
            }
            .contact-button {
                top: 190px;
                font-size: 14px;
                padding: 10px 35px;
            }
            .instruction-text {
                top: 240px;
                font-size: 11px;
                padding: 8px 12px;
                max-width: 280px;
            }
        }

        @media (max-height: 500px) {
            .profile-container {
                width: 80px;
                height: 80px;
                top: 10px;
            }
            .profile-name {
                top: 100px;
                font-size: 15px;
            }
            .profile-phone {
                top: 125px;
                font-size: 11px;
            }
            .contact-button {
                top: 160px;
                font-size: 13px;
                padding: 8px 30px;
            }
            .instruction-text {
                top: 200px;
                font-size: 10px;
                padding: 6px 10px;
                max-width: 260px;
            }
        }
    </style>
</head>
<body>
    <!-- Circular profile picture - WhatsApp style -->
    <div class="profile-container">
        <img src="/assets/dp.png" alt="">
    </div>
    
    <!-- Name below the profile picture - WhatsApp style -->
    <div class="profile-name">খাদিজা আক্তার</div>
    
    <!-- Partially hidden phone number - WhatsApp style -->
    <div class="profile-phone">
        <span class="phone-visible">+912838</span>
        <span class="phone-hidden">384384</span>
        <span class="lock-icon">🔒</span>
    </div>

    <!-- WhatsApp-style contact button -->
    <a href="https://www.google.com" target="_blank" class="contact-button">
        <span class="button-icon">💬</span>
        Connect
    </a>

    <!-- Instruction text below the contact button -->
    <div class="instruction-text">
        WhatsApp-এ যোগাযোগ করতে উপরের Connect বাটনে ক্লিক করুন, তাহলে সরাসরি আমার WhatsApp-এ যুক্ত হতে পারবেন। একবার না হলে দ্বিতীয়বার চেষ্টা করুন।
    </div>
</body>
</html>
